name: Inspect previous high-quality photo uploads
on:
  push:
    paths:
      - '.github/workflows/inspect-photo-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect photo blobs for dimensions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request,struct
          shas=["91ab1cd63f7c313cb29d66fce5291f756660c144","ec55754b76ddd5692ebc7d9a7c94e03ab940b64e","bbb872ae546c40491f70b8f8b4678699e9feda71"]
          for sha in shas:
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO_NAME']}/git/blobs/{sha}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              try:
                  data=json.load(urllib.request.urlopen(req))
                  raw=base64.b64decode(data["content"])
                  with open(f"/tmp/{sha}.img","wb") as f:f.write(raw)
                  print("BLOB",sha,"SIZE",len(raw),"MAGIC",raw[:12].hex(),flush=True)
              except Exception as e:print("ERROR",sha,str(e),flush=True)
          PY
      - name: Identify photos
        run: |
          file /tmp/*.img || true
          for f in /tmp/*.img; do identify "$f" 2>&1 || true; done
